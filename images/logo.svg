  <!-- ── LEFT EAR (natural, hanging) ── -->
  <path d="
    M 95,68
    C 88,64 76,62 66,68
    C 56,74 50,86 48,100
    C 46,114 48,130 54,140
    C 60,150 68,154 74,148
    C 80,142 80,130 78,118
    C 76,106 76,88 82,78
