        C 162,22 182,36 190,54
        C 198,72 196,90 190,104
        C 185,116 180,122 178,132
        C 176,142 178,156 176,168
        C 174,180 168,192 158,198
        C 150,204 140,206 130,204
        C 120,202 112,196 108,188
        L 98,208
        C 94,218 92,228 94,238
        L 94,256
        L 186,256
        L 186,238
        C 188,228 186,218 182,208
        L 172,188
        C 168,196 160,202 150,204
        C 170,192 174,180 176,168
        C 178,156 176,142 178,132
        C 180,122 185,116 190,104
        C 196,90 198,72 190,54
        C 182,36 162,22 140,22 Z
      "/>
    </clipPath>
