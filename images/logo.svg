    C 224,74 230,86 232,100
    C 234,114 232,130 226,140
    C 220,150 212,154 206,148
    C 200,142 200,130 202,118
    C 204,106 204,88 198,78
    C 194,72 188,68 185,68 Z
  " fill="#111111"/>

